resources:
  jobs:
    tag_hr_schemas:
      name: tag_hr_schemas
      tags:
        HR: ""
      tasks:
        - task_key: apply_governed_tags
          notebook_task:
            notebook_path: ../../src/tag_hr_schemas.py
            base_parameters:
              catalog: ${var.catalog}
              success_factor_bronze_schema: ${resources.schemas.success_factor_bronze.name}
              success_factor_silver_schema: ${resources.schemas.success_factor_silver.name}
              success_factor_gold_schema: ${resources.schemas.success_factor_gold.name}
