resources:
  jobs:
    hr_compensation:
      name: hr_compensation
      description: Compensation data product. Optionally regenerates bronze, then always refreshes silver and gold. Requires the workforce silver tables (success_factor) to exist.
      max_concurrent_runs: 1
      tags:
        "People and Culture": ""
        environment: ${var.environment}
      parameters:
        - name: init_bronze
          default: "false"
        - name: schemas
          default: >-
            ${var.adp_silver_schema},${var.compensation_gold_schema}
      tasks:
        - task_key: check_init_bronze
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.init_bronze}}"
            right: "true"

        - task_key: init_adp
          depends_on:
            - task_key: check_init_bronze
              outcome: "true"
          notebook_task:
            notebook_path: ../../../_shared/bronze_init/adp.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.adp_bronze_schema}

        # Bronze tables are recreated by the init tasks, so streaming checkpoints are reset.
        - task_key: refresh_full
          depends_on:
            - task_key: init_adp
          pipeline_task:
            pipeline_id: ${resources.pipelines.hr_compensation_pipeline.id}
            full_refresh: true
        - task_key: refresh_incremental
          depends_on:
            - task_key: check_init_bronze
              outcome: "false"
          pipeline_task:
            pipeline_id: ${resources.pipelines.hr_compensation_pipeline.id}

        - task_key: tag_tables
          depends_on:
            - task_key: refresh_full
            - task_key: refresh_incremental
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: ../../../_shared/ops/tag_hr_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schemas: "{{job.parameters.schemas}}"

        - task_key: column_metadata
          depends_on:
            - task_key: tag_tables
          notebook_task:
            notebook_path: ../../metadata/column_metadata.sql
            base_parameters:
              catalog: ${var.catalog}
              adp_silver_schema: ${var.adp_silver_schema}
              compensation_gold_schema: ${var.compensation_gold_schema}
